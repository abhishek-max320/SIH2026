version: '3.8'

services:
  # FastAPI Backend with Native C++ Risk Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agrisentinel_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AgriSentinel AI
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./agrisentinel.db
      - SECRET_KEY=sih2026_super_secret_jwt_key_production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/app/static:/app/backend/app/static
    restart: unless-stopped

  # Next.js 15 Full-Stack UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agrisentinel_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
